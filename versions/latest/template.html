<!DOCTYPE html>
<html lang="%lang%" x-version="%version%">
  <head>
    <meta charset="%encoding%" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="description" content="%meta_description%" />
    <meta name="keywords" content="%meta_keywords%" />
    <link rel="icon" href="/static/assets/favicon.svg">
    <title>%meta_title%</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/sidebar.css" />
    <link rel="stylesheet" href="/static/css/base.css" />
    <link rel="stylesheet" href="/static/css/instajax.css" />
    <link rel="stylesheet" href="/static/css/color-themes/carats.css" />
    <link rel="stylesheet" href="/static/css/carats.css" />
    <script type="text/javascript" src="/static/plugins/log-logo.js" ></script>
    <script type="text/javascript" src="/static/plugins/instajax.js" ></script>
    <link rel="stylesheet" href="/static/css/hljs-tokyo-night-dark.min.css">
    <script>window.dictionary = %dictionary%;</script>
  </head>
  <body>
    <div class="instajax-progress-bar loading"></div>
    <div id="layout">
      <aside id="menu">
        <header>
          %logo%
          %nav%
        </header>
        <a href="#menu" id="menuLink" aria-label="%d%.toggle_menu">
          <span></span>
        </a>
      </aside>
      <main>
        %header%
        <article>
          %search%
          <div id="toc"></div>
          <div class="content">%content%</div>
        </article>
      </main>
      %footer%
    </div>
    <script src="/static/js/ui.js"></script>
    <script type="module" src="/static/js/search.js" defer></script>
  </body>
</html>
